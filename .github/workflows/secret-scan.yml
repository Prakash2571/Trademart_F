name: Secret scan

# The operator console. Two questions, neither previously checked:
#
#   1. Did a credential get committed?
#   2. Did a server-side value get COMPILED INTO the browser bundle?
#
# The second is the one that leaks silently. Next inlines every NEXT_PUBLIC_* variable
# into client JavaScript at build time, so a credential given a NEXT_PUBLIC_ name is
# published to everyone who loads the console - and nothing about that looks wrong in a
# code review.
#
# This console is also the one place an operator SESSION exists, so an accidentally
# bundled session secret or operator API key would be worse here than anywhere else.
#
# CALIBRATION MATTERS MORE THAN COVERAGE
# -------------------------------------
# The patterns match credential SHAPES, not the words "token" or "secret". An earlier
# draft matched the words and fired on .env.example placeholders, documentation and
# redaction test fixtures across these repos. A check that cries wolf is one people learn
# to ignore, which is worse than no check.
#
# Verified both ways before being committed: zero hits across all three Trademart repos,
# and all five planted credential shapes detected.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-secrets:
    name: no credentials in source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan for credential-shaped literals
        run: |
          set -uo pipefail
          PATTERNS='shpat_[A-Za-z0-9]{32,}'
          PATTERNS="$PATTERNS|shpca_[A-Za-z0-9]{32,}"
          PATTERNS="$PATTERNS|shpss_[A-Za-z0-9]{32,}"
          PATTERNS="$PATTERNS|rzp_live_[A-Za-z0-9]{10,}"
          PATTERNS="$PATTERNS|sk_live_[A-Za-z0-9]{16,}"
          PATTERNS="$PATTERNS|mongodb(\+srv)?://[^:@/[:space:]<>]+:[^@[:space:]<>]+@"

          PLACEHOLDER='user:pass@|user:password@|username:password@|<user>|<password>|changeme|placeholder|example\.com|YOUR_|xxxx|redacted'

          HITS=$(grep -rInE "$PATTERNS" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude=package-lock.json \
            --exclude=secret-scan.yml 2>/dev/null | grep -viE "$PLACEHOLDER" || true)

          if [ -n "$HITS" ]; then
            echo "::error title=Credential in source::A credential-shaped literal is committed. ROTATE IT FIRST, then remove it - git history keeps the old value."
            echo "$HITS"
            exit 1
          fi
          echo "no credential-shaped literals found"

      - name: Assert no .env file is tracked
        run: |
          set -uo pipefail
          TRACKED=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error title=.env committed::A .env file is tracked. Only .env.example belongs in the repository."
            echo "$TRACKED"
            exit 1
          fi
          echo "no tracked .env files"

      - name: Assert no NEXT_PUBLIC_ variable is credential-named
        run: |
          set -uo pipefail
          # The actual mistake this guards: giving a credential a NEXT_PUBLIC_ name.
          # NEXT_PUBLIC_API_BASE_URL is the only one this console needs, and a URL is not
          # a credential.
          MATCHES=$(grep -rhoE 'NEXT_PUBLIC_[A-Z0-9_]+' src/ 2>/dev/null | sort -u \
            | grep -E '(TOKEN|SECRET|PASSWORD|CREDENTIAL|PRIVATE|APIKEY|API_KEY)' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error title=Public credential name::These NEXT_PUBLIC_ variables look like credentials. NEXT_PUBLIC_* is inlined into client JavaScript, so they would be readable by anyone who loads the console:"
            echo "$MATCHES"
            exit 1
          fi
          echo "no credential-named NEXT_PUBLIC_ variables"

  client-bundle:
    name: no server secrets in the client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same environment the CI build uses. The point is not to test a value but to
      # inspect which NAMES the compiler inlined.
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # Scans the compiled chunks for credential VALUE SHAPES, not variable NAMES.
      #
      # Grepping for names was tried first and was wrong twice over. It fired on three
      # chunks because this console legitimately RENDERS those names as operator guidance
      # - "The backend has no OPERATOR_PASSWORD_HASH and SESSION_SECRET set" on the login
      # page, and similar actionable text in errorMessages.ts. Those are documentation,
      # not credentials, and the guidance is worth keeping.
      #
      # It is also the wrong mechanism: Next only inlines process.env.X when X begins with
      # NEXT_PUBLIC_. A non-prefixed process.env.SESSION_SECRET in a client component
      # compiles to `undefined`, so the name appearing in a bundle does not imply the
      # value is there.
      #
      # Value shapes catch what actually matters - a real token that reached the bundle by
      # ANY route: a NEXT_PUBLIC_ misnaming, a hardcoded literal, or an API response
      # baked in at build time.
      - name: Assert no credential values in the client bundle
        run: |
          set -uo pipefail
          PATTERNS='shpat_[A-Za-z0-9]{32,}'
          PATTERNS="$PATTERNS|shpca_[A-Za-z0-9]{32,}"
          PATTERNS="$PATTERNS|shpss_[A-Za-z0-9]{32,}"
          PATTERNS="$PATTERNS|rzp_live_[A-Za-z0-9]{10,}"
          PATTERNS="$PATTERNS|sk_live_[A-Za-z0-9]{16,}"
          PATTERNS="$PATTERNS|mongodb(\+srv)?://[^:@/[:space:]<>]+:[^@[:space:]<>]+@"

          FOUND=$(grep -rlE "$PATTERNS" .next/static 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error title=Credential value in client bundle::A credential-shaped value appears in .next/static, which browsers download. ROTATE IT, then find how it reached the bundle:"
            echo "$FOUND"
            exit 1
          fi
          echo "no credential-shaped values in the client bundle"

      # The complementary check, on SOURCE rather than output: a client component reading a
      # non-public secret env var compiles to `undefined` today, but it signals a
      # misunderstanding - and the tempting "fix" is to add a NEXT_PUBLIC_ prefix, which
      # would publish it. Caught here while it is still harmless.
      - name: Assert no client component reads a non-public secret variable
        run: |
          set -uo pipefail
          SECRETS='SHOPIFY_ACCESS_TOKEN|SHOPIFY_CLIENT_SECRET|SHOPIFY_WEBHOOK_SECRET|RAZORPAY_KEY_SECRET|RAZORPAY_WEBHOOK_SECRET|MONGODB_URI|OPERATOR_API_KEY|OPERATOR_PASSWORD_HASH|SESSION_SECRET|TOKEN_ENCRYPTION_KEY'
          # Only process.env reads count. A bare mention in JSX help text is fine.
          HITS=$(grep -rlE "process\.env\.($SECRETS)" src/ 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error title=Secret read in frontend::These files read a server-only secret from process.env. In a Next client bundle that yields undefined, and the tempting fix - adding NEXT_PUBLIC_ - would publish it to every visitor:"
            echo "$HITS"
            exit 1
          fi
          echo "no non-public secret reads in frontend source"
