name: CI

# Runs on every push and PR.
#
# The build step matters more here than it looks: earlier frontend work was
# committed without ever running `next build`, so type errors and bad imports
# reached the repository unnoticed. This job is what stops that recurring.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # setup-node's `cache: npm` hashes a lockfile to build the cache key and
      # FAILS the whole job if none exists. A lockfile could not be generated
      # where this repo was authored (the npm registry was unreachable), so if
      # one is not committed we generate it here FIRST, using the runner's
      # preinstalled node, which does have registry access. This runs before
      # setup-node so the cache step finds the file, and lets the job use
      # `npm ci` either way.
      #
      # Commit package-lock.json (npm install --package-lock-only) to make the
      # install fully reproducible; this step then no-ops.
      - name: Ensure a lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            echo "Committed lockfile present."
          else
            echo "::warning title=No committed lockfile::Generating package-lock.json for this run only. Commit it (npm install --package-lock-only) for reproducible installs."
            npm install --package-lock-only --no-audit --no-fund
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # NEXT_PUBLIC_* values are inlined at build time. `/api` is the production
      # value (same-origin through nginx) and is what should be compile-checked.
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # output: 'standalone' is what the Docker runtime stage copies. If a
      # config change silently drops it, the image builds and then fails to
      # start, which is a far more expensive way to find out.
      - name: Assert standalone output was produced
        run: |
          test -f .next/standalone/server.js \
            || { echo "::error title=No standalone output::.next/standalone/server.js is missing. next.config.mjs must set output: 'standalone' for the Docker image to work."; exit 1; }
          echo "standalone output present"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------------------------------------------------------------------
# Branch protection (manual step)
#
# Settings -> Branches -> add a rule for `main`:
#   - Require a pull request before merging
#   - Require status checks to pass:
#       "typecheck, build"
#       "docker image"
#   - Require branches to be up to date before merging
# ---------------------------------------------------------------------------
