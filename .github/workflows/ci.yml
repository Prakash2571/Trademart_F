name: CI

# Runs on every push and PR.
#
# The build step matters more here than it looks: earlier frontend work was
# committed without ever running `next build`, so type errors and bad imports
# reached the repository unnoticed. This job is what stops that recurring.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` ONLY. package-lock.json is committed (lockfileVersion 3, every
      # package carrying an integrity hash), so this installs the exact resolved
      # tree and fails loudly if the lockfile and package.json disagree. The
      # earlier "generate a lockfile if none exists" step has been removed now
      # that a real one exists: a fallback that silently resolves fresh versions
      # would let the image ship dependencies CI never tested.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint: dead code and control-flow mistakes (tsconfig.lint.json) - unused
      # imports, unused locals and parameters, a path that forgets to return, a switch
      # case that falls through. None of those fail a normal typecheck, and all of them
      # are either a leftover from a refactor or a bug.
      #
      # No --fix anywhere: a CI job that rewrites the tree produces a green build for
      # code nobody reviewed.
      #
      # ESLint itself is NOT run here. eslint.config.mjs is committed and ready, but it
      # cannot be installed without regenerating package-lock.json, and `npm ci` failing
      # when the lockfile and package.json disagree is a property worth keeping. The
      # rules that matter most in the meantime - the API client boundary, unsafe HTML,
      # credentials in web storage, secrets in NEXT_PUBLIC_, accessibility basics and
      # confirmation on destructive actions - are asserted directly in
      # src/lib/repoGuards.test.ts and run in the Test step below. See the header of
      # eslint.config.mjs for the exact command that turns ESLint on.
      - name: Lint
        run: npm run lint

      # Unit tests for the framework-free part of src/lib: the API client (session
      # cookie, CSRF header, error normalisation, correlation id), error
      # presentation, capability verdicts, formatting, and the repository guards.
      #
      # These run on `tsc` + `node --test`, both of which are already available -
      # see the comment in tsconfig.test.json for why a test framework was not
      # added. React components are covered by the typechecker and `next build`
      # below, not here.
      - name: Test
        run: npm test

      # NEXT_PUBLIC_* values are inlined at build time. `/api` is the production
      # value (same-origin through nginx) and is what should be compile-checked.
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # output: 'standalone' is what the Docker runtime stage copies. If a
      # config change silently drops it, the image builds and then fails to
      # start, which is a far more expensive way to find out.
      - name: Assert standalone output was produced
        run: |
          test -f .next/standalone/server.js \
            || { echo "::error title=No standalone output::.next/standalone/server.js is missing. next.config.mjs must set output: 'standalone' for the Docker image to work."; exit 1; }
          echo "standalone output present"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          push: false
          load: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------------------------------------------------------------------
# Branch protection (manual step)
#
# Settings -> Branches -> add a rule for `main`:
#   - Require a pull request before merging
#   - Require status checks to pass:
#       "typecheck, lint, test, build"   (this job has been renamed twice as stages
#                                         were added - update the rule if it was set)
#       "docker image"
#       "no credentials in source"
#   - Require branches to be up to date before merging
# ---------------------------------------------------------------------------
